name: Daily SmartLink Sync

on:
  schedule:
    # Runs at 05:07 UTC every day. Cron time is always UTC.
    # Minute 7 avoids the busy top-of-the-hour queue on GitHub.
    - cron: '7 5 * * *'
  workflow_dispatch:
    # Lets you trigger a run manually from the GitHub Actions tab
    # any time, without waiting for the schedule.

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Firebase credentials from secret
        run: |
          echo "${{ secrets.FIREBASE_CREDENTIALS_JSON_BASE64 }}" | base64 -d > firebase_credentials.json

      - name: Run smartlink sync
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          FIREBASE_CREDENTIALS_PATH: firebase_credentials.json
        run: python main.py
