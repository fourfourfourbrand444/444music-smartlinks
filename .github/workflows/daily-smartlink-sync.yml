name: Daily SmartLink Sync

on:
  schedule:
    # Runs at 03:00 UTC every day. Adjust the hour to whenever you want
    # — cron time is always UTC regardless of your local timezone.
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Lets you trigger a run manually from the GitHub Actions tab
    # any time, without waiting for the schedule — useful for testing.

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Firebase credentials from secret
        run: |
          echo "${{ secrets.FIREBASE_CREDENTIALS_JSON_BASE64 }}" | base64 -d > firebase_credentials.json

      - name: Run smartlink sync
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FIREBASE_CREDENTIALS_PATH: firebase_credentials.json
        run: python main.py
